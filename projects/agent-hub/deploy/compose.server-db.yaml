# Run only on the authorized remote server, from /opt/agent-hub/database.
name: agent-hub-data

services:
  postgres:
    image: postgres:18.6-bookworm
    container_name: agent-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:?Create the server .env first}
      HUB_OWNER_PASSWORD: ${HUB_OWNER_PASSWORD:?Create the server .env first}
      HUB_RUNTIME_PASSWORD: ${HUB_RUNTIME_PASSWORD:?Create the server .env first}
      HUB_INDEXER_PASSWORD: ${HUB_INDEXER_PASSWORD:?Create the server .env first}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init/01_roles.sql:/docker-entrypoint-initdb.d/01_roles.sql:ro
      - ./init/02_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    networks:
      - database
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 128
    shm_size: 128m
    stop_grace_period: 60s
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=40
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - timezone=UTC
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d agent_hub"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s

volumes:
  pgdata:
    name: agent-hub-postgres-data

networks:
  database:
    name: agent-hub-database
    internal: true
