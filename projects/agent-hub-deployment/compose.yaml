name: ${HUB_STACK_NAME:?Run deploy.py init first}

x-application: &application
  image: ${HUB_BACKEND_IMAGE}
  entrypoint: [python, /deployment/app-entrypoint.py]
  volumes:
    - ./scripts/app-entrypoint.py:/deployment/app-entrypoint.py:ro
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  init: true
  restart: unless-stopped
  mem_limit: 256m
  memswap_limit: 256m
  cpus: "0.25"
  pids_limit: 64
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
  depends_on:
    migrate: {condition: service_completed_successfully}

x-environment: &environment
  HUB_PUBLIC_URL: ${HUB_PUBLIC_URL}
  HUB_ENVIRONMENT: ${HUB_ENVIRONMENT}
  HUB_MAIL_MODE: ${HUB_MAIL_MODE}

x-operations: &operations
  image: ${HUB_OPERATIONS_IMAGE}
  environment:
    <<: *environment
    HUB_BACKUP_INTERVAL_SECONDS: ${HUB_BACKUP_INTERVAL_SECONDS}
    HUB_AUDIT_INTERVAL_SECONDS: ${HUB_AUDIT_INTERVAL_SECONDS}
    HUB_RESTORE_INTERVAL_SECONDS: ${HUB_RESTORE_INTERVAL_SECONDS}
  volumes:
    - backups:/backups
    - staging:/staging
    - work:/work:ro
    - model:/model:ro
    - updates:/updates:ro
    - ./.runtime/secrets:/config/secrets:ro
    - ./.env:/config/settings.env:ro
  secrets:
    - postgres_password
    - owner_password
    - application_key
    - restic_password
  networks: [backend, semantic, egress]
  cap_drop: [ALL]
  cap_add: [DAC_READ_SEARCH, DAC_OVERRIDE, CHOWN, FOWNER]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 384m
  memswap_limit: 384m
  cpus: "0.35"
  pids_limit: 64
  logging: *logging

services:
  db:
    image: ${HUB_DATABASE_IMAGE}
    build:
      context: ../agent-hub
      dockerfile: deploy/Dockerfile.postgres-vector
    environment:
      POSTGRES_DB: agent_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, owner_password, runtime_password, document_password, memory_password, embedding_password, generation_password]
    volumes:
      - database:/var/lib/postgresql
      - ./scripts/db-init.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
      - ../agent-hub/deploy/01_roles.sql:/deployment/01_roles.sql:ro
      - ../agent-hub/deploy/02_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    command: [postgres, -c, shared_buffers=32MB, -c, max_connections=64, -c, work_mem=2MB]
    networks: [backend]
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.5"
    pids_limit: 128
    shm_size: 128m
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, agent_hub]
      interval: 5s
      timeout: 3s
      retries: 30

  migrate:
    <<: *application
    build: {context: ../agent-hub, target: runtime}
    command: [agent-hub, migrate]
    environment: {<<: *environment, HUB_DB_ROLE: hub_owner}
    secrets:
      - {source: owner_password, target: database_password}
      - application_key
    networks: [backend]
    restart: "no"
    depends_on: {db: {condition: service_healthy}}

  api:
    <<: *application
    build: {context: ../agent-hub, target: runtime}
    command: [agent-hub, serve, --host, 0.0.0.0, --port, "8765"]
    environment:
      <<: *environment
      HUB_DB_ROLE: hub_runtime
      HUB_ARTIFACT_DIRECTORY: /work
      HUB_ARTIFACT_PROJECT_BYTES: ${HUB_ARTIFACT_PROJECT_BYTES}
      HUB_ARTIFACT_TOTAL_BYTES: ${HUB_ARTIFACT_TOTAL_BYTES}
      HUB_EMBEDDING_URL: http://embedding:8766
      FORWARDED_ALLOW_IPS: "*"
    secrets:
      - {source: runtime_password, target: database_password}
      - application_key
      - bootstrap_token
    volumes:
      - ./scripts/app-entrypoint.py:/deployment/app-entrypoint.py:ro
      - work:/work
    networks: [backend, front, semantic, egress]
    mem_limit: 512m
    memswap_limit: 512m
    cpus: "0.75"
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz',timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 10

  document-worker:
    <<: *application
    command: [agent-hub, document-worker]
    environment: {<<: *environment, HUB_DB_ROLE: hub_document_worker}
    secrets:
      - {source: document_password, target: database_password}
      - application_key
    networks: [backend, egress]

  memory-worker:
    <<: *application
    command: [agent-hub, memory-worker]
    environment: {<<: *environment, HUB_DB_ROLE: hub_memory_worker}
    secrets:
      - {source: memory_password, target: database_password}
      - application_key
    networks: [backend]

  embedding-worker:
    <<: *application
    command: [agent-hub, embedding-worker]
    environment: {<<: *environment, HUB_DB_ROLE: hub_embedding_worker, HUB_EMBEDDING_URL: "http://embedding:8766"}
    secrets:
      - {source: embedding_password, target: database_password}
      - application_key
    networks: [backend, semantic]

  generation-worker:
    <<: *application
    command: [agent-hub, generation-worker]
    environment: {<<: *environment, HUB_DB_ROLE: hub_generation_worker}
    secrets:
      - {source: generation_password, target: database_password}
      - application_key
    networks: [backend, egress]

  embedding:
    image: ${HUB_EMBEDDING_IMAGE}
    build: {context: ../agent-hub-embedding}
    volumes: [model:/model:ro]
    networks: [semantic]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    cpus: "0.5"
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8766/healthz',timeout=3).read()"]
      interval: 10s
      timeout: 4s
      retries: 20

  gateway:
    image: ${HUB_GATEWAY_IMAGE}
    entrypoint: [sh, /deployment/gateway.sh]
    volumes:
      - ./.runtime/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./scripts/gateway.sh:/deployment/gateway.sh:ro
      - tls:/tls:ro
      - acme-web:/var/www/acme:ro
      - updates:/srv/agent-hub/desktop-updates:ro
    ports:
      - ${HUB_HTTP_BIND}:${HUB_HTTP_PORT}:8080
      - ${HUB_HTTP_BIND}:${HUB_HTTPS_PORT}:8443
    networks: [front, egress]
    depends_on: {api: {condition: service_healthy}}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m
    cpus: "0.25"
    pids_limit: 64
    logging: *logging
    healthcheck:
      test: [CMD, wget, --quiet, --no-check-certificate, --spider, "https://127.0.0.1:8443/healthz"]
      interval: 10s
      timeout: 4s
      retries: 10

  scheduler:
    <<: *operations
    command: [schedule]
    restart: unless-stopped
    depends_on: {api: {condition: service_healthy}}

  operations:
    <<: *operations
    profiles: [tools]
    command: [check]
    build:
      context: ..
      dockerfile: agent-hub-deployment/Dockerfile.ops
      args: {BACKEND_IMAGE: "${HUB_BACKEND_IMAGE}"}

  setup:
    image: ${HUB_OPERATIONS_IMAGE}
    profiles: [tools]
    command: [prepare]
    environment: {<<: *environment, HUB_PUBLIC_HOST: "${HUB_PUBLIC_HOST}", HUB_TLS_MODE: "${HUB_TLS_MODE}"}
    volumes:
      - work:/work
      - model:/model
      - updates:/updates
      - tls:/tls
      - ./.runtime/tls-input:/tls-input:ro
      - ./assets.lock.json:/deployment/assets.lock.json:ro
      - ./reference/windows-stable.json:/deployment/windows-stable.json:ro
      - ../agent-hub-embedding/model-manifest.json:/deployment/model-manifest.json:ro
    networks: [egress]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.5"

  certificates:
    image: ${HUB_CERTBOT_IMAGE}
    profiles: [acme]
    entrypoint: [sh, /deployment/certbot.sh]
    command: [renew]
    environment:
      HUB_ACME_EMAIL: ${HUB_ACME_EMAIL}
      HUB_ACME_IDENTIFIER_FLAG: ${HUB_ACME_IDENTIFIER_FLAG}
      HUB_PUBLIC_HOST: ${HUB_PUBLIC_HOST}
      HUB_ACME_PROFILE: ${HUB_ACME_PROFILE}
    volumes:
      - ./scripts/certbot.sh:/deployment/certbot.sh:ro
      - ./scripts/publish-tls.py:/deployment/publish-tls.py:ro
      - acme:/etc/letsencrypt
      - acme-web:/var/www/acme
      - tls:/tls
    networks: [egress]
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: "0.25"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/var/lib/letsencrypt, /var/log/letsencrypt, /tmp]

secrets:
  postgres_password: {file: ./.runtime/secrets/postgres_password}
  owner_password: {file: ./.runtime/secrets/owner_password}
  runtime_password: {file: ./.runtime/secrets/runtime_password}
  document_password: {file: ./.runtime/secrets/document_password}
  memory_password: {file: ./.runtime/secrets/memory_password}
  embedding_password: {file: ./.runtime/secrets/embedding_password}
  generation_password: {file: ./.runtime/secrets/generation_password}
  application_key: {file: ./.runtime/secrets/application_key}
  bootstrap_token: {file: ./.runtime/secrets/bootstrap_token}
  restic_password: {file: ./.runtime/secrets/restic_password}

volumes:
  database: {}
  work: {}
  model: {}
  updates: {}
  backups: {}
  staging: {}
  tls: {}
  acme: {}
  acme-web: {}

networks:
  backend: {internal: true}
  semantic: {internal: true}
  front: {internal: true}
  egress: {}
