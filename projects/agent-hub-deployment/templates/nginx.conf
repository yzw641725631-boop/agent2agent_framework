user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    log_format hub '$remote_addr $request_method $uri $status $body_bytes_sent';
    access_log /dev/stdout hub;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $uri $hub_auth_key {
        default "";
        /api/auth/enrollments $binary_remote_addr;
        /api/closeouts/discover $binary_remote_addr;
        ~^/api/setup/ $binary_remote_addr;
    }
    limit_req_zone $hub_auth_key zone=hub_auth:1m rate=2r/s;

    server {
        listen 8080;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/acme; }
        location / { return 308 @@PUBLIC_URL@@$request_uri; }
    }

    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /tls/current/fullchain.pem;
        ssl_certificate_key /tls/current/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:HubTLS:1m;
        ssl_session_timeout 1h;

        client_max_body_size 2m;
        client_body_timeout 20s;

        location = /desktop-updates/win-x64/stable.json {
            root /srv/agent-hub;
            default_type application/json;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location ~ ^/desktop-updates/win-x64/AgentHub-[0-9]+\.[0-9]+\.[0-9]+-win-x64\.zip$ {
            root /srv/agent-hub;
            default_type application/zip;
            sendfile on;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location ~ ^/desktop-updates/win-x64/AgentHub-Setup-[0-9]+\.[0-9]+\.[0-9]+\.exe$ {
            root /srv/agent-hub;
            default_type application/vnd.microsoft.portable-executable;
            sendfile on;
            add_header Content-Disposition "attachment";
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location /desktop-updates/ { return 404; }

        location /api/git/ {
            client_max_body_size 64m;
            client_body_timeout 120s;
            proxy_pass http://api:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 150s;
            proxy_send_timeout 150s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location ~ "^/api/(?:projects/[a-f0-9-]{36}/tasks/[a-f0-9-]{36}/worklogs/[a-f0-9-]{36}|closeouts/[a-f0-9-]{36}/checkpoints/[a-f0-9-]{36})/snapshot(?:/content)?$" {
            client_max_body_size 96m;
            client_body_timeout 300s;
            proxy_pass http://api:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 360s;
            proxy_send_timeout 360s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location / {
            limit_req zone=hub_auth burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://api:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
    }
}
